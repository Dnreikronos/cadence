[package]
name = "confidential-transfer-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Throwaway spike for issue #46. Not a workspace member — it is deliberately
# standalone so it can be deleted whole once the finding is recorded.
#
# Note what is NOT here: spl-token-client. ADR B18 picks it for the confidential
# helpers, and it cannot be used for this. Its 0.19.1 release is built on
# solana-message 3.x, which has no v1 message, and the only solana-rpc-client
# release it agrees with (4.0.0) pins solana-hash to ~4.2 while solana-message
# 5.x — the first with v1 — needs >=4.6. The two cannot be resolved into one
# binary. See FINDINGS in the README.
#
# So the proof generation comes straight from the crate spl-token-client itself
# calls, and the instruction builders from the Token-2022 interface. Nothing is
# hand-rolled that B18 meant to keep out of our hands.

[dependencies]
spl-token-2022-interface = "3.1"
spl-token-confidential-transfer-proof-generation = "0.6"
spl-token-confidential-transfer-proof-extraction = "0.6"

solana-zk-sdk = "7.0"
solana-zk-sdk-pod = "0.1"
solana-address = { version = "2.6", features = ["curve25519"] }
solana-keypair = "3.1"
solana-signer = "3.0"
solana-signature = { version = "3.6", features = ["verify"] }
solana-instruction = "3.0"
solana-system-interface = { version = "3.2", features = ["bincode"] }

# Transaction v1 (SIMD-0296 / SIMD-0385), first available in solana-message 5.x.
# Token-2022 emits solana-instruction 3.x and solana-message 5.x consumes 4.x,
# so both are here and src/v1.rs copies between them.
solana-hash = "4.7"
solana-message = { version = "5.1", features = ["wincode"] }
solana-transaction = { version = "5.1", features = ["wincode"] }
solana-instruction-v1 = { package = "solana-instruction", version = "4.0" }
wincode = "0.6"

anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
bs58 = "0.5.1"
