[package]
name = "cadence-proof"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
async-trait = "0.1"
base64 = "0.22"
spl-token-client = { version = "=0.19.1", default-features = false }
solana-account = "3.2"
solana-address = "2.6"
solana-hash = "4.7"
solana-instruction = "3.0"
solana-instruction-v1 = { package = "solana-instruction", version = "4.0" }
solana-message = { version = "5.1", features = ["wincode"] }
solana-transaction = { version = "5.1", features = ["wincode"] }
solana-transaction-legacy = { package = "solana-transaction", version = "3.1" }
solana-signature = "3.6"
solana-signer = "3.0"
solana-zk-sdk = "7.0"
spl-token-2022-interface = "3.1"
wincode = "0.6"

[patch.crates-io]
spl-token-client = { path = "vendor/spl-token-client" }

[dev-dependencies]
solana-keypair = "3.1"
tower = { version = "0.5", features = ["util"] }
