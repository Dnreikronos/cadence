[package]
name = "cadence-proof"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
async-trait = "0.1"
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
uuid = "1"
base64 = "0.22"
bytemuck = "1"
sha2 = "0.10"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-zk-elgamal-proof-interface = "0.1.3"
solana-zk-sdk-pod = "0.1"
spl-token-confidential-transfer-proof-extraction = "0.6"
spl-token-client = { version = "=0.19.1", default-features = false }
solana-account = "3.2"
solana-address = { version = "2.6", features = ["curve25519"] }
solana-hash = "4.7"
solana-instruction = "3.0"
solana-instruction-v1 = { package = "solana-instruction", version = "4.0" }
solana-message = { version = "5.1", features = ["wincode"] }
solana-transaction = { version = "5.1", features = ["wincode"] }
solana-transaction-legacy = { package = "solana-transaction", version = "3.1" }
solana-signature = { version = "3.6", features = ["verify"] }
solana-signer = "3.0"
solana-zk-sdk = "7.0"
spl-token-2022-interface = "3.1"
wincode = "0.6"
zeroize = "1.8"
futures-util = "0.3"

[patch.crates-io]
spl-token-client = { path = "vendor/spl-token-client" }

[dev-dependencies]
static_assertions = "1.1"
solana-keypair = "3.1"
tower = { version = "0.5", features = ["util"] }
