[package]
name = "cadence-mint"
version = "0.0.0"
edition = "2021"
publish = false

# Creates and inspects the wrapped USDC mint. Standalone, like the spike, and on
# the same dependency set for the same reasons — see the note in
# spikes/confidential-transfer/Cargo.toml. The token-wrap program crate is not
# here either: it is built on the 2.x Solana crates, so its three instructions
# and five PDAs are written out in src/token_wrap.rs instead.

[dependencies]
spl-token-2022-interface = "3.1"

solana-zk-sdk-pod = "0.1"
solana-address = { version = "2.6", features = ["curve25519"] }
solana-keypair = "3.1"
solana-signer = "3.0"
solana-instruction = "3.0"
solana-system-interface = { version = "3.2", features = ["bincode"] }

solana-hash = "4.7"
solana-message = { version = "5.1", features = ["wincode"] }
solana-transaction = { version = "5.1", features = ["wincode"] }
solana-instruction-v1 = { package = "solana-instruction", version = "4.0" }
wincode = "0.6"

anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
