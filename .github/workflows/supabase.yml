name: Supabase

on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v1
        with:
          version: 2.118.0
      - name: Apply every migration to a fresh database
        run: supabase db start
      - name: Prove tenant isolation and invite rules
        run: supabase test db
