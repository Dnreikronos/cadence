name: Supabase

on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.118.0
      - name: Apply every migration to a fresh database
        run: supabase db start
      - name: Prove tenant isolation and invite rules
        run: supabase test db
