name: Proof service

on:
  pull_request:
    paths: ['services/proof/**', 'supabase/migrations/**', '.github/workflows/proof.yml']
  push:
    branches: [main]
    paths: ['services/proof/**', 'supabase/migrations/**', '.github/workflows/proof.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrap-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - suite: wrap_storage
            filter: wrap_records
          - suite: runs_storage
            filter: run_storage
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: wrap-test-only
          POSTGRES_DB: wrap_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d wrap_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: services/proof
      - name: Verify receipt permissions and immutable confirmations
        env:
          WRAP_TEST_DATABASE_URL: postgres://postgres:wrap-test-only@localhost:5432/wrap_test
          RUNS_TEST_DATABASE_URL: postgres://postgres:wrap-test-only@localhost:5432/wrap_test
        run: cargo test --locked --test ${{ matrix.suite }} ${{ matrix.filter }} -- --ignored
  vault:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        suite: [keys, confidential_vault, transfer_http, runs_http, unwrap_http]
    services:
      postgres:
        image: supabase/postgres:17.6.1.143
        env:
          POSTGRES_PASSWORD: keys-test-only
          POSTGRES_DB: keys_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d keys_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: services/proof
      - name: Prepare disposable Vault fixture
        run: docker exec -i ${{ job.services.postgres.id }} psql -U supabase_admin -d keys_test -v ON_ERROR_STOP=1 < tests/support/vault.sql
      - name: Verify encrypted storage and audited access
        env:
          VAULT_TEST_DATABASE_URL: postgres://postgres:keys-test-only@localhost:5432/keys_test
          CONFIDENTIAL_VAULT_TEST_DATABASE_URL: postgres://postgres:keys-test-only@localhost:5432/keys_test
          TRANSFER_TEST_DATABASE_URL: postgres://postgres:keys-test-only@localhost:5432/keys_test
        run: cargo test --locked --test ${{ matrix.suite }} -- --ignored
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: audit-test-only
          POSTGRES_DB: audit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy && rustup default 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: services/proof
      - run: cargo fmt --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Verify the mint tool still uses the shared wrap instructions
        run: cargo test --locked --manifest-path ../../ops/mint/Cargo.toml token_wrap
      - name: Verify audit database permissions
        env:
          AUDIT_TEST_DATABASE_URL: postgres://postgres:audit-test-only@localhost:5432/audit_test
        run: cargo test --locked --test audit -- --ignored
      - name: Build runtime image
        run: docker build --build-arg BUILD_SHA="$GITHUB_SHA" -t cadence-proof:ci .
      - name: Check health against devnet and stop gracefully
        env:
          PROOF_RPC_URL: https://api.devnet.solana.com
        run: |
          set -euo pipefail
          docker run -d --name proof-smoke -p 127.0.0.1:3000:3000 -e PROOF_RPC_URL cadence-proof:ci
          trap 'docker logs proof-smoke; docker rm -f proof-smoke >/dev/null' EXIT
          healthy=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 8 http://127.0.0.1:3000/health > /tmp/proof-health.json; then
              jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .rpc_reachable == true and .build_sha == $sha' /tmp/proof-health.json
              healthy=true
              break
            fi
            sleep 5
          done
          test "$healthy" = true
          cat /tmp/proof-health.json
          docker stop --time 15 proof-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' proof-smoke)" = 0
